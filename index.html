<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = localStorage.getItem("wilson.theme")
        const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      } catch {}
    </script>
    <meta name="description" content="Wilson’s portfolio in full-stack software engineering, collaboration with AI agents, and explorations in LLM inference optimization." />
    <meta property="og:title" content="Wilson · Software Engineer" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Selected engineering projects and explorations in LLM inference optimization." />
    <title>Wilson’s homepage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
